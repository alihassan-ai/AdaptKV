model:
  name: "meta-llama/Meta-Llama-3-8B"
  dtype: "float32"
  use_tiny_model: true
  tiny_model_name: "facebook/opt-125m"

cache:
  budget_ratio: 0.2
  recent_window: 32
  heavy_hitter_ratio: 0.5
  sink_tokens: 4

policy:
  hidden_dim: 64
  num_features: 5
  num_tiers: 3
  attention_window: 16
  learning_rate: 0.001
  training_epochs: 3
  training_samples: 100

distributed:
  simulate: true
  num_simulated_gpus: 4
  comm_penalty_lambda: 0.1
  prefetch_top_k: 16
  migration_threshold: 0.3

evaluation:
  context_lengths: [512, 1024, 2048]
  batch_size: 1
  max_new_tokens: 32
